name: Update Rust manifests

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rust-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Track stable and nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check automation credentials
        shell: bash
        env:
          AUTOMATION_GPG_PRIVATE_KEY: ${{ secrets.AUTOMATION_GPG_PRIVATE_KEY }}
          AUTOMATION_GPG_PASSPHRASE: ${{ secrets.AUTOMATION_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$AUTOMATION_GPG_PRIVATE_KEY"
          test -n "$AUTOMATION_GPG_PASSPHRASE"

      - name: Install Guix
        timeout-minutes: 15
        run: .github/scripts/setup-guix.sh

      - name: Fetch and verify official manifests
        id: update
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/manifest-update.log"
          guix repl -L guix scripts/update-manifests.scm stable nightly \
            | tee "$log_file"
          if [[ -z $(git status --porcelain=v1 --untracked-files=all -- manifests) ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Rust manifest update'
            echo '```text'
            cat "$log_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated manifests
        if: steps.update.outputs.changed == 'true'
        run: ./scripts/validate-release.sh

      - name: Sign and publish manifest update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          AUTOMATION_GPG_PRIVATE_KEY: ${{ secrets.AUTOMATION_GPG_PRIVATE_KEY }}
          AUTOMATION_GPG_PASSPHRASE: ${{ secrets.AUTOMATION_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          base_commit=$(git rev-parse HEAD)
          change_count=0
          while IFS= read -r -d '' entry; do
            path=${entry:3}
            case "$path" in
              manifests/index.scm|manifests/snapshots/*.toml) ;;
              *)
                printf 'refusing unexpected change: %s\n' "$path" >&2
                exit 1
                ;;
            esac
            change_count=$((change_count + 1))
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          test "$change_count" -gt 0
          git diff --check
          git add --all -- manifests/index.scm manifests/snapshots
          git diff --cached --check

          fingerprint=5A5F539FD271C277ACC197CDD17FBF2AA776E8E4
          export GNUPGHOME
          GNUPGHOME=$(mktemp --directory "$RUNNER_TEMP/gnupg.XXXXXX")
          chmod 700 "$GNUPGHOME"
          gpg_wrapper="$RUNNER_TEMP/gpg-loopback"
          trap 'rm -rf "$GNUPGHOME" "$gpg_wrapper"' EXIT

          printf '%s' "$AUTOMATION_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$fingerprint" >/dev/null
          cat > "$gpg_wrapper" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            "$@" 3<<<"$AUTOMATION_GPG_PASSPHRASE"
          EOF
          chmod 700 "$gpg_wrapper"

          git config user.name "Guix Rust Toolchain Automation"
          git config user.email "guix-rust-toolchain-automation@ordchaos.com"
          git config user.signingkey "$fingerprint"
          git config gpg.program "$gpg_wrapper"
          git commit -S"$fingerprint" -m "Update bundled Rust manifests"
          git verify-commit HEAD

          git fetch --no-tags origin \
            master:refs/remotes/origin/master \
            keyring:refs/remotes/origin/keyring
          if [[ $(git rev-parse origin/master) != "$base_commit" ]]; then
            echo "master changed during manifest validation; refusing to push" >&2
            exit 1
          fi
          guix git authenticate -k origin/keyring \
            --end="$(git rev-parse HEAD)" \
            7eb3c7727b341ac671f1b7a06054a8aacc28cb52 \
            FF0F1FE0A176071F0E39A94DFF93E1DAE0897EDE
          git push origin HEAD:master

          printf 'Published signed commit `%s`.\n' "$(git rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"
